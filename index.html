<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nivel del Tanque</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 30px 25px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
            text-align: center;
            color: #fff;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 15px;
            color: #a8b5ff;
        }
        .litros-display {
            font-size: 4.5rem;
            font-weight: 700;
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            padding: 25px 15px;
            margin: 20px 0;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.3);
        }
        .litros-display span {
            font-size: 2.5rem;
            font-weight: 300;
            color: #a8b5ff;
        }
        .distancia-display {
            font-size: 1.2rem;
            color: #b0b8d1;
            margin-bottom: 10px;
        }
        .estado {
            font-size: 1.1rem;
            padding: 8px 20px;
            border-radius: 50px;
            display: inline-block;
            margin-top: 10px;
            font-weight: 600;
        }
        .estado.ok {
            background: rgba(0, 230, 118, 0.25);
            color: #69f0ae;
            border: 1px solid rgba(0, 230, 118, 0.3);
        }
        .estado.warning {
            background: rgba(255, 193, 7, 0.25);
            color: #ffd54f;
            border: 1px solid rgba(255, 193, 7, 0.3);
        }
        .estado.danger {
            background: rgba(255, 82, 82, 0.25);
            color: #ff8a80;
            border: 1px solid rgba(255, 82, 82, 0.3);
        }
        .barra-container {
            background: rgba(0,0,0,0.4);
            border-radius: 30px;
            height: 20px;
            overflow: hidden;
            margin: 20px 0 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .barra {
            height: 100%;
            width: 0%;
            border-radius: 30px;
            background: linear-gradient(90deg, #00c853, #69f0ae);
            transition: width 0.5s ease;
        }
        .info {
            font-size: 0.85rem;
            color: #8892b0;
            margin-top: 15px;
        }
        .actualizado {
            font-size: 0.75rem;
            color: #5a6390;
            margin-top: 10px;
        }
        .error-msg {
            color: #ff8a80;
            padding: 15px;
            background: rgba(255,82,82,0.15);
            border-radius: 12px;
            margin-top: 10px;
            display: none;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #a8b5ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .litros-display.loading .loading {
            display: inline-block;
        }
        .litros-display .loading {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>💧 Tanque</h1>
    
    <div class="litros-display" id="litrosDisplay">
        <span id="litrosValor">--</span> <span>L</span>
        <div class="loading" id="loadingSpinner"></div>
    </div>
    
    <div class="distancia-display">
        📏 Distancia: <span id="distanciaValor">--</span> cm
    </div>
    
    <div class="barra-container">
        <div class="barra" id="barra"></div>
    </div>
    
    <div id="estadoContainer">
        <span class="estado" id="estadoLabel">Cargando...</span>
    </div>
    
    <div class="error-msg" id="errorMsg">⚠️ Error al obtener datos. Verifica tu conexión y token.</div>
    
    <div class="info">Capacidad total: <span id="capacidadTexto">600</span> L</div>
    <div class="actualizado" id="actualizadoTexto">Actualizando...</div>
</div>

<script>
    // ==========================================
    // CONFIGURACIÓN (cambia con tus datos)
    // ==========================================
    const UBIDOTS_TOKEN = "BBUS-Zasklp8UQeYxYp42md3fQSx4F0rWYy"; // Cambia por tu token real
    const DEVICE_LABEL = "tanque";
    const VARIABLE_LABEL_LITROS = "litros";
    const CAPACIDAD_TOTAL = 600; // Capacidad total en litros (ajústala)
    
    // URL de la API de Ubidots para obtener el último valor de la variable
    const API_URL = `https://industrial.api.ubidots.com/api/v1.6/devices/${DEVICE_LABEL}/${VARIABLE_LABEL_LITROS}/values/`;
    
    // ==========================================
    // FUNCIONES
    // ==========================================
    async function obtenerLitros() {
        const litrosValor = document.getElementById('litrosValor');
        const distanciaValor = document.getElementById('distanciaValor');
        const barra = document.getElementById('barra');
        const estadoLabel = document.getElementById('estadoLabel');
        const errorMsg = document.getElementById('errorMsg');
        const actualizadoTexto = document.getElementById('actualizadoTexto');
        const loadingSpinner = document.getElementById('loadingSpinner');
        
        // Mostrar loading
        litrosValor.textContent = '...';
        loadingSpinner.style.display = 'inline-block';
        errorMsg.style.display = 'none';
        
        try {
            const response = await fetch(API_URL, {
                headers: {
                    'X-Auth-Token': UBIDOTS_TOKEN,
                    'Content-Type': 'application/json'
                }
            });
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            
            const data = await response.json();
            
            // La respuesta es un array con los últimos valores
            // El más reciente es el primero (index 0)
            if (data && data.length > 0) {
                const ultimo = data[0];
                const litros = ultimo.value;
                // Nota: la distancia no viene en la misma variable, pero podemos obtenerla de otra variable si la quieres
                // Por ahora solo mostramos litros
                
                // Mostrar litros
                litrosValor.textContent = litros.toFixed(1);
                
                // Actualizar barra
                const porcentaje = Math.min((litros / CAPACIDAD_TOTAL) * 100, 100);
                barra.style.width = porcentaje + '%';
                
                // Cambiar color de la barra según nivel
                if (litros < 20) {
                    barra.style.background = 'linear-gradient(90deg, #ff1744, #ff8a80)';
                } else if (litros < 50) {
                    barra.style.background = 'linear-gradient(90deg, #ff9100, #ffd54f)';
                } else {
                    barra.style.background = 'linear-gradient(90deg, #00c853, #69f0ae)';
                }
                
                // Estado
                if (litros < 20) {
                    estadoLabel.textContent = '⚠️ Nivel Crítico';
                    estadoLabel.className = 'estado danger';
                } else if (litros < 50) {
                    estadoLabel.textContent = '⚠️ Nivel Bajo';
                    estadoLabel.className = 'estado warning';
                } else if (litros > 550) {
                    estadoLabel.textContent = '⚠️ Casi Lleno';
                    estadoLabel.className = 'estado warning';
                } else {
                    estadoLabel.textContent = '✅ Nivel Normal';
                    estadoLabel.className = 'estado ok';
                }
                
                // Fecha de actualización
                const fecha = new Date(ultimo.timestamp);
                actualizadoTexto.textContent = `Última actualización: ${fecha.toLocaleString()}`;
                
                // Intentar obtener distancia (opcional) desde otra variable
                try {
                    const distResp = await fetch(`https://industrial.api.ubidots.com/api/v1.6/devices/${DEVICE_LABEL}/distancia/values/`, {
                        headers: { 'X-Auth-Token': UBIDOTS_TOKEN }
                    });
                    if (distResp.ok) {
                        const distData = await distResp.json();
                        if (distData && distData.length > 0) {
                            distanciaValor.textContent = distData[0].value.toFixed(1);
                        }
                    }
                } catch (e) {
                    // Si no se puede obtener distancia, no importa
                    distanciaValor.textContent = '--';
                }
                
            } else {
                throw new Error('No hay datos disponibles');
            }
            
        } catch (error) {
            console.error('Error:', error);
            errorMsg.textContent = `⚠️ Error: ${error.message}. Verifica tu token y conexión.`;
            errorMsg.style.display = 'block';
            litrosValor.textContent = '--';
            barra.style.width = '0%';
            estadoLabel.textContent = '⚠️ Error';
            estadoLabel.className = 'estado danger';
        } finally {
            loadingSpinner.style.display = 'none';
        }
    }
    
    // ==========================================
    // INICIALIZAR
    // ==========================================
    // Obtener datos al cargar la página
    obtenerLitros();
    
    // Actualizar cada 15 segundos
    setInterval(obtenerLitros, 15000);
</script>

</body>
</html>
